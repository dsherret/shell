# GENERATED by .github/workflows/ci.ts -- do not edit manually

name: ci
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request: {}
concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true
jobs:
  test:
    name: 'shell-${{ matrix.os }}'
    runs-on: '${{ matrix.os }}'
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.x
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - uses: dprint/check@9cb3a2b17a8e606d37aae341e49df3654933fc23 # v2.3
        if: runner.os == 'Linux'
      - name: lint
        if: runner.os == 'Linux'
        run: deno lint
      - name: check
        if: runner.os == 'Linux'
        run: deno check --all
      - name: lint ci
        if: runner.os == 'Linux'
        run: deno run -A @david/gagen --lint
      - name: deno test
        run: deno test -P
      - name: node test
        run: 'deno task test:node'
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.x
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Get tag version
        id: get_tag_version
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: 'echo TAG_VERSION=${GITHUB_REF/refs\/tags\//} >> $GITHUB_OUTPUT'
      - name: npm build
        run: 'deno task dnt ${{ steps.get_tag_version.outputs.TAG_VERSION }}'
      - name: npm publish
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: cd npm && npm publish --access public
  jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.x
      - name: Publish to JSR on tag
        run: 'deno run -A jsr:@david/publish-on-tag@0.2.0'
